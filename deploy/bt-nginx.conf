# ╔══════════════════════════════════════════════════════════╗
# ║  LinScio MedComm SaaS — 宝塔面板 Nginx 反向代理配置    ║
# ║                                                        ║
# ║  使用方法:                                              ║
# ║  宝塔 → 网站 → www.linscio.com → 配置文件              ║
# ║  将此内容粘贴到 server{} 块中（替换默认内容）           ║
# ╚══════════════════════════════════════════════════════════╝

# ── 限流区域（放在 server{} 块外，即 http{} 层级）─────────
# 宝塔 → Nginx 设置 → 配置修改 → 在 http{} 块末尾加入：
#
# limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=auth_login:5m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=auth_register:5m rate=3r/m;
# limit_req_zone $binary_remote_addr zone=api_generate:5m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=api_payment:5m rate=5r/m;

# ── 以下内容放入网站的 server{} 块中 ──────────────────────

# 安全响应头
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Gzip 压缩
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

# 上传文件大小限制（文献 PDF）
client_max_body_size 50m;

# ── 前端静态文件 ──────────────────────────────────────────
# 宝塔网站根目录设为: /opt/medcomm/dist
# 宝塔会自动配置 root 和 index

# 静态资源长缓存
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# ── 限流路由 ──────────────────────────────────────────────

location /api/v1/auth/login {
    limit_req zone=auth_login burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/auth/register {
    limit_req zone=auth_register burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ /api/v1/(sections/.*/generate|articles/.*/generate-all) {
    limit_req zone=api_generate burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

location /api/v1/payment/create {
    limit_req zone=api_payment burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 支付回调（不限流）
location /api/v1/payment/notify {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── API 通用 ──────────────────────────────────────────────

location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# 健康检查
location /health {
    proxy_pass http://127.0.0.1:8765;
}

# Prometheus 指标（仅本机）
location /metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8765;
}

# Vue Router history 模式（放最后）
location / {
    try_files $uri $uri/ /index.html;
}
