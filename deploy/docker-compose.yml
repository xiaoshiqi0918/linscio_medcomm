version: "3.8"

# ╔══════════════════════════════════════════════════════════╗
# ║  LinScio MedComm SaaS — Docker Compose                 ║
# ║  宝塔面板方案：Nginx 由宝塔管理，此处仅跑后端三件套      ║
# ╚══════════════════════════════════════════════════════════╝

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medcomm
      POSTGRES_USER: medcomm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init.conf:/etc/postgresql/custom.conf:ro
    command: postgres -c config_file=/etc/postgresql/custom.conf
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 768M
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcomm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - .env.production
    environment:
      DEPLOYMENT_MODE: saas
      DATABASE_URL: postgresql+asyncpg://medcomm:${POSTGRES_PASSWORD:-changeme}@postgres:5432/medcomm
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - backend_data:/app/.data
    deploy:
      resources:
        limits:
          memory: 1024M
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  backend_data:
