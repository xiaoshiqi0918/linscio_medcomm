# ╔══════════════════════════════════════════════════════════╗
# ║  LinScio MedComm SaaS — Nginx 配置                     ║
# ║  复制到 /etc/nginx/sites-available/medcomm 使用         ║
# ╚══════════════════════════════════════════════════════════╝

# ── 限流区域 ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_login:5m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_register:5m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_generate:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_payment:5m rate=5r/m;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name www.linscio.com linscio.com;
    return 301 https://www.linscio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.linscio.com;

    # SSL 证书（按实际路径修改）
    ssl_certificate     /etc/nginx/ssl/www.linscio.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/www.linscio.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件
    root /app/dist;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 上传文件大小限制（文献 PDF）
    client_max_body_size 50m;

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 限流路由 ──────────────────────────────────────────

    location /api/v1/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/register {
        limit_req zone=auth_register burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /api/v1/(sections/.*/generate|articles/.*/generate-all) {
        limit_req zone=api_generate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/v1/payment/create {
        limit_req zone=api_payment burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 支付回调（不限流）
    location /api/v1/payment/notify {
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API 通用 ──────────────────────────────────────────

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8765;
    }

    # Prometheus（仅本机 / 内网）
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8765;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
